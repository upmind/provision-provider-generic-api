services:
  php83:
    build:
      context: .
      args:
        PHP_VERSION: "8.3"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["bash", "-lc", "while true; do sleep 1000; done"]
    tty: true
    stdin_open: true

  php84:
    build:
      context: .
      args:
        PHP_VERSION: "8.4"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["bash", "-lc", "while true; do sleep 1000; done"]
    tty: true
    stdin_open: true

  php85:
